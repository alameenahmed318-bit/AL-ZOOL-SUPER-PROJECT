name: Build AL-ZOOL WPF

on:
  push:
    branches:
      - main
      - fix/mt5-connection
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "AL-ZOOL-SUPER-AI-Project-v3/AL-ZOOL-SUPER-AI/ALZOOOOL.csproj"

      - name: Build
        run: dotnet build "AL-ZOOL-SUPER-AI-Project-v3/AL-ZOOL-SUPER-AI/ALZOOOOL.csproj" --configuration Release --no-restore

      - name: Publish self-contained app
        run: dotnet publish "AL-ZOOL-SUPER-AI-Project-v3/AL-ZOOL-SUPER-AI/ALZOOOOL.csproj" --configuration Release --no-restore --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "${{ runner.temp }}/AL-ZOOL-Publish"

      - name: Package ZIP
        shell: pwsh
        run: Compress-Archive -Path "${{ runner.temp }}/AL-ZOOL-Publish/*" -DestinationPath "${{ runner.temp }}/AL-ZOOL-SUPER-AI-win-x64.zip" -Force

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AL-ZOOL-SUPER-AI-win-x64
          path: ${{ runner.temp }}/AL-ZOOL-SUPER-AI-win-x64.zip
          if-no-files-found: error
          retention-days: 14
